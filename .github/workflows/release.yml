name: Build and release

on:
  pull_request:
  push:
    branches: [master]
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    name: Build and test (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: macos-15
            target: aarch64-apple-darwin
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup update stable --no-self-update
      - name: Run tests
        shell: bash
        run: |
          # Run terminal fixtures one at a time on macOS.
          if [[ "$RUNNER_OS" == macOS ]]; then
            export RUST_TEST_THREADS=1
          fi
          cargo +stable test --locked --target "$TARGET" -- --nocapture
        timeout-minutes: 4
      - run: cargo +stable build --release --locked --target "$TARGET"
      - name: Smoke-test and package the binary
        shell: bash
        run: |
          binary="target/$TARGET/release/secsetter"
          cat > "$RUNNER_TEMP/secsetter.toml" <<'TOML'
          [[entries]]
          id = "smoke"
          label = "Smoke test"
          kind = "login"
          commands = [["true"]]
          TOML
          "$binary" --help
          "$binary" -c "$RUNNER_TEMP/secsetter.toml" validate
          tar -czf "secsetter-$TARGET.tar.gz" -C "$(dirname "$binary")" secsetter
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: secsetter-${{ matrix.target }}
          path: secsetter-${{ matrix.target }}.tar.gz
          if-no-files-found: error
          overwrite: true

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the release tag
        shell: bash
        run: |
          version=$(cargo metadata --locked --no-deps --format-version 1 | jq -er '.packages[] | select(.name == "secsetter") | .version')
          if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "Release tag $GITHUB_REF_NAME must match Cargo version v$version." >&2
            exit 1
          fi
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: secsetter-*
          merge-multiple: true
          path: release
      - name: Publish to GitHub Releases
        working-directory: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha256sum secsetter-*.tar.gz > SHA256SUMS
          flags=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            flags+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" secsetter-*.tar.gz SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes "${flags[@]}"
