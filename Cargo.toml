[package]
name = "secsetter"
version = "0.1.0"
edition = "2024"

[dependencies]
crossterm = "0.29"
getrandom = "0.4"
libc = "0.2"
rustix = { version = "1", features = ["fs", "process", "termios"] }
serde = { version = "1", features = ["derive"] }
toml = "1"
unicode-width = "0.2"

[dev-dependencies]
tempfile = "3"
