[package]
name = "secsetter"
version = "1.0.0"
edition = "2024"
repository = "https://github.com/prepin/secsetter"

[dependencies]
crossterm = "0.29"
getrandom = "0.4"
libc = "0.2"
oneyaml = "1.2"
ratatui = { version = "0.30", default-features = false, features = ["crossterm_0_29", "layout-cache"] }
rustix = { version = "1", features = ["fs", "net", "process", "termios"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
toml = "1"
toml_edit = "0.25"
unicode-width = "0.2"
tempfile = "3"

[dev-dependencies]
rustix = { version = "1", features = ["event", "pty"] }
